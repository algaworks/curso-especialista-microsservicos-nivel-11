apiVersion: v1
kind: Secret
metadata:
  name: delivery-tracking-secret
  labels:
    app: delivery-tracking
type: Opaque
stringData:                 # texto puro aqui; o K8s codifica em base64
  DB_URL: {{ .Values.database.url | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  DB_PASSWORD: {{ required "database.password e obrigatorio (o OpenTofu injeta com set_sensitive)" .Values.database.password | quote }}
