# Duas aplicacoes, a MESMA imagem. O que distingue quem respondeu e o campo
# Hostname do corpo da resposta, que e o nome do Pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hellojava
  namespace: default
  labels:
    app: hellojava
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hellojava
  template:
    metadata:
      labels:
        app: hellojava
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          args: ["--name=hellojava"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hellojava
  namespace: default
spec:
  # ClusterIP basta: o ALB entrega direto no IP do Pod (target-type ip).
  type: ClusterIP
  selector:
    app: hellojava
  ports:
    - port: 80
      targetPort: 80
